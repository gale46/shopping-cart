version: "3.8"
services:

  # ── Redis Cluster（給 Go API 用：購物車 / 商品 cache）────────────

  # Master 1
  redis-1:
    image: redis:8.0
    container_name: redis-1
    ports: ["6371:6379", "16371:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # Master 2
  redis-2:
    image: redis:8.0
    container_name: redis-2
    ports: ["6372:6379", "16372:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # Master 3
  redis-3:
    image: redis:8.0
    container_name: redis-3
    ports: ["6373:6379", "16373:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # Slave 1
  redis-4:
    image: redis:8.0
    container_name: redis-4
    ports: ["6374:6379", "16374:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # Slave 2
  redis-5:
    image: redis:8.0
    container_name: redis-5
    ports: ["6375:6379", "16375:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # Slave 3
  redis-6:
    image: redis:8.0
    container_name: redis-6
    ports: ["6376:6379", "16376:16379"]
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --appendonly yes
    networks: [redis-net]

  # ── Redis Cluster 初始化（只跑一次，分配 slot）────────────────────
  redis-init:
    image: redis:8.0
    container_name: redis-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    networks: [redis-net]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for host in redis-1 redis-2 redis-3 redis-4 redis-5 redis-6; do
          until redis-cli -h $$host ping | grep -q PONG; do
            echo "等待 $$host..."
            sleep 1
          done
          echo "$$host 就緒"
        done
        redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379 --cluster-replicas 1 --cluster-yes
    restart: "no"

  # ── Redis Session（給 PHP frontend 用：存 session）───────────────
  # 單機 Redis，穩定不出錯
  # PHP session 不走 Cluster，避免 RedisClusterException
  redis-session:
    image: redis:8.0
    container_name: redis-session
    ports: ["6370:6379"]
    command: redis-server --appendonly yes
    networks:
      - app-net   # 只需要跟 frontend 同網路

  # ── Go API ───────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: api
    networks:
      - app-net     # 與 frontend 通訊
      - redis-net   # 與 Redis Cluster 通訊
    depends_on:
      - redis-init  # 確保 cluster 初始化完才啟動
      - db
    ports:
      - "8080:8080"

  # ── PHP Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./api/uploads:/var/www/html/uploads
    ports:
      - "3000:80"
    networks:
      - app-net     # 與 api / db / redis-session 通訊
    depends_on:
      - db
      - api
      - redis-session

  # ── MySQL ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 9151999
      MYSQL_DATABASE: ShoppingCart
    ports:
      - "3306:3306"
    networks:
      - app-net
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

networks:
  app-net:
    driver: bridge
  redis-net:
    driver: bridge

# ── 網路職責說明 ────────────────────────────────────────────────────
# app-net:   frontend ↔ api ↔ db ↔ redis-session
# redis-net: api ↔ redis-1/2/3/4/5/6（Cluster）
# frontend 不進 redis-net，避免直接碰 Cluster 造成錯誤